# Every push and pull request: run the automated tests on GitHub.
# The live site runs on the team's server (Isaac's PC) and updates itself from main within ~2 minutes,
# but only if these same tests pass there too (see deploy/README.md).
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
